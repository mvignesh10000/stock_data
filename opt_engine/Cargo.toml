[workspace]
resolver = "2"
members = ["crates/core_types", "crates/data_loader", "crates/oms_simulator", "crates/strategy_api", "crates/cli_runner"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
