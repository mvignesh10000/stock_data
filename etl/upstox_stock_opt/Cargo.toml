[package]
name = "upstox_stock_opt"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
arrow-array = "55"
arrow-schema = "55"
parquet = { version = "55", default-features = false, features = ["arrow", "zstd"] }

[profile.release]
opt-level = 3
